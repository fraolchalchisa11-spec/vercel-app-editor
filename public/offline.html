<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123FBE">
<title>You're offline – BTR</title>
<style>
  :root { --bg:#fff; --text:#0F172A; --sub:#64748B; --ring:#E4ECFD; --err:#E11D48; --blue:#123FBE; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0B1220; --text:#F1F5F9; --sub:#94A3B8; --ring:rgba(147,197,253,.12); --err:#FCA5A5; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Ethiopic", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px;
    padding-top: calc(32px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  }
  .ring { width: 112px; height: 112px; border-radius: 50%; background: var(--ring); display: flex; align-items: center; justify-content: center; margin-bottom: 28px; }
  .dot { width: 80px; height: 80px; border-radius: 50%; background: var(--blue); display: flex; align-items: center; justify-content: center; }
  h1 { margin: 0; font-size: 24px; font-weight: 800; }
  p.msg { margin: 12px 0 0; max-width: 300px; font-size: 16px; line-height: 1.6; color: var(--sub); }
  button {
    margin-top: 32px; display: inline-flex; align-items: center; gap: 8px;
    background: var(--blue); color: #fff; border: 0; border-radius: 16px;
    padding: 14px 32px; font-size: 16px; font-weight: 700; font-family: inherit;
    box-shadow: 0 8px 20px rgba(18,63,190,.3); cursor: pointer;
  }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .7; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #fail { margin-top: 16px; font-size: 14px; font-weight: 600; color: var(--err); visibility: hidden; }
</style>
</head>
<body>
  <div class="ring"><div class="dot">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="2" y1="2" x2="22" y2="22"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div></div>

  <h1>You're offline</h1>
  <p class="msg">Please connect to the internet and try again.</p>

  <button id="retry" type="button">
    <svg id="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
    <span id="label">Try again</span>
  </button>
  <div id="fail" role="status">Still no connection.</div>

<script>
  var btn = document.getElementById("retry"), label = document.getElementById("label"),
      ic = document.getElementById("ic"), fail = document.getElementById("fail");

  function goHome() { window.location.replace("/"); }

  function retry() {
    btn.disabled = true; label.textContent = "Checking…"; ic.setAttribute("class", "spin"); fail.style.visibility = "hidden";
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 6000) : null;
    // A real request (not the saved page) confirms the internet actually works.
    fetch("/?_online_check=" + Date.now(), { method: "HEAD", cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
      .then(function () { if (timer) clearTimeout(timer); goHome(); })
      .catch(function () {
        if (timer) clearTimeout(timer);
        btn.disabled = false; label.textContent = "Try again"; ic.removeAttribute("class");
        fail.style.visibility = "visible";
      });
  }

  btn.addEventListener("click", retry);
  // Go back to the app automatically the moment the connection returns.
  window.addEventListener("online", retry);
</script>
</body>
</html>
